<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble or Gone: The Long Run to Dawn</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1430; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobble or Gone: run a turkey 1500 metres through farmyard, barn, kitchen and woods, outrunning the farmer and the dinner bell. Space jumps, Down slides, Shift dashes, H hides, G gobbles."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
